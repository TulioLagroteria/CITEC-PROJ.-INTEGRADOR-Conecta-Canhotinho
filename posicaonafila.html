<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css" />
  <title>Posição na Fila - Conecta Canhotinho</title>
</head>
<body>

  <button class="back-btn">← Voltar</button>

  <div class="container">
    <div class="header">
      <h1>Posição na Fila</h1>
      <p>Acompanhe seu atendimento em tempo real</p>
    </div>

    <div class="ticket-card">
      <div class="ticket-label">Sua senha</div>
      <div class="ticket-number">A-047</div>
      <div class="ticket-service">Consulta Clínica Geral</div>

      <div class="status-badge waiting">Aguardando atendimento</div>

      <div class="info-grid">
        <div class="info-item">
          <div class="label">Sua posição</div>
          <div class="value">08</div>
        </div>
        <div class="info-item">
          <div class="label">Pessoas na frente</div>
          <div class="value">07</div>
        </div>
        <div class="info-item">
          <div class="label">Previsão de espera</div>
          <div class="value small">~ 35 min</div>
        </div>
        <div class="info-item">
          <div class="label">Guichê / Sala</div>
          <div class="value small">Sala 03</div>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-label">
          <span>Progresso da fila</span>
          <span>35%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-outline">Atualizar</button>
      <button class="btn btn-primary">Ver detalhes</button>
    </div>

    <div class="update-info">
      Última atualização: agora mesmo
    </div>
  </div>

</body>
</html>
