<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posição na Fila - Conecta Canhotinho</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #0057B8 0%, #003d82 50%, #002a5c 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Botão voltar */
    .back-btn {
      position: absolute;
      top: 30px;
      left: 40px;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 40px 30px;
      text-align: center;
    }

    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
    }

    /* Card principal da senha */
    .ticket-card {
      background: white;
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      margin-bottom: 30px;
    }

    .ticket-label {
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .ticket-number {
      font-size: 64px;
      font-weight: 800;
      color: #0057B8;
      line-height: 1;
      margin-bottom: 6px;
    }

    .ticket-service {
      font-size: 18px;
      color: #333;
      font-weight: 600;
      margin-bottom: 30px;
    }

    /* Status */
    .status-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .status-badge.waiting {
      background: #fff3e0;
      color: #ef6c00;
    }

    /* Informações da fila */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 10px;
    }

    .info-item {
      background: #f5f7fa;
      border-radius: 16px;
      padding: 20px 15px;
    }

    .info-item .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 6px;
    }

    .info-item .value {
      font-size: 28px;
      font-weight: 700;
      color: #0057B8;
    }

    .info-item .value.small {
      font-size: 20px;
    }

    /* Barra de progresso */
    .progress-section {
      margin-top: 30px;
      text-align: left;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 10px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #F4C300, #ffd11a);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    /* Ações */
    .actions {
      display: flex;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: #F4C300;
      color: #003d82;
    }

    .btn-primary:hover {
      background: #ffd11a;
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.45);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .update-info {
      margin-top: 25px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
    }

    /* Responsivo */
    @media (max-width: 600px) {
      .back-btn {
        top: 20px;
        left: 20px;
      }

      .ticket-number {
        font-size: 52px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <button class="back-btn">← Voltar</button>

  <div class="container">
    <div class="header">
      <h1>Posição na Fila</h1>
      <p>Acompanhe seu atendimento em tempo real</p>
    </div>

    <div class="ticket-card">
      <div class="ticket-label">Sua senha</div>
      <div class="ticket-number">A-047</div>
      <div class="ticket-service">Consulta Clínica Geral</div>

      <div class="status-badge waiting">Aguardando atendimento</div>

      <div class="info-grid">
        <div class="info-item">
          <div class="label">Sua posição</div>
          <div class="value">08</div>
        </div>
        <div class="info-item">
          <div class="label">Pessoas na frente</div>
          <div class="value">07</div>
        </div>
        <div class="info-item">
          <div class="label">Previsão de espera</div>
          <div class="value small">~ 35 min</div>
        </div>
        <div class="info-item">
          <div class="label">Guichê / Sala</div>
          <div class="value small">Sala 03</div>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-label">
          <span>Progresso da fila</span>
          <span>35%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-outline">Atualizar</button>
      <button class="btn btn-primary">Ver detalhes</button>
    </div>

    <div class="update-info">
      Última atualização: agora mesmo
    </div>
  </div>

</body>
</html>
