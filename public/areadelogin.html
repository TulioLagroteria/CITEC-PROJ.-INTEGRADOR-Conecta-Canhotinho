<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecta Canhotinho</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #0057B8 0%, #003d82 50%, #002a5c 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /*SECTION DE LOGIN*/
    .login-container {
    background-color: #efe8d3;
    max-width: 480px;
    padding: 25px;
    border: 3px solid #0D3044;
    margin: 30px auto;
    border-radius: 8px;
    height: 480px;
    }

    .login-form {
    display: flex;
    flex-direction: column;
    }

    /* Botão Entrar como Convidado - canto superior direito */
    .guest-btn {
      position: absolute;
      top: 30px;
      right: 40px;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .guest-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.7);
      transform: translateY(-1px);
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    /* Logo */
    .logo-container {
      width: 220px;
      height: 220px;
      background: #0057B8;
      border-radius: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      margin-bottom: 40px;
      transition: transform 0.3s ease;
    }

    .logo-container:hover {
      transform: scale(1.03);
    }

    .logo-svg {
      width: 180px;
      height: 180px;
    }

    .app-name {
      color: white;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -1px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .app-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      margin-bottom: 60px;
      font-weight: 400;
    }

    /* Botões */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 340px;
    }

    .btn {
      width: 100%;
      padding: 18px 32px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: #F4C300;
      color: #003d82;
      box-shadow: 0 8px 25px rgba(244, 195, 0, 0.35);
    }

    .btn-primary:hover {
      background: #ffd11a;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(244, 195, 0, 0.45);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.45);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .footer {
      margin-top: 50px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 15px;
    }

    .footer a {
      color: #F4C300;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: #ffd11a;
    }

    /* Responsivo */
    @media (max-width: 600px) {
      .guest-btn {
        top: 20px;
        right: 20px;
        padding: 8px 16px;
        font-size: 13px;
      }

      .logo-container {
        width: 160px;
        height: 160px;
        border-radius: 36px;
      }
      .logo-svg {
        width: 130px;
        height: 130px;
      }
      .app-name {
        font-size: 28px;
      }
      .app-subtitle {
        font-size: 15px;
        margin-bottom: 40px;
      }
    }
  </style>
</head>



<body>


  <div class="container">
    <!-- Logo -->
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Ondas laterais -->
        <path d="M15 70 Q5 100 15 130" fill="none" stroke="#F4C300" stroke-width="10" stroke-linecap="round"/>
        <path d="M30 55 Q15 100 30 145" fill="none" stroke="#F4C300" stroke-width="10" stroke-linecap="round"/>
        <path d="M185 70 Q195 100 185 130" fill="none" stroke="#F4C300" stroke-width="10" stroke-linecap="round"/>
        <path d="M170 55 Q185 100 170 145" fill="none" stroke="#F4C300" stroke-width="10" stroke-linecap="round"/>

        <!-- Contorno do celular -->
        <rect x="50" y="30" width="100" height="140" rx="14" ry="14" fill="none" stroke="white" stroke-width="8"/>
        <rect x="80" y="38" width="40" height="8" rx="4" fill="white"/>

        <!-- Escudo -->
        <path d="M70 60 L130 60 L130 130 Q100 155 70 130 Z" fill="#FFD700" stroke="#FFD700"/>
        
        <!-- Superior esquerdo - arco-íris -->
        <rect x="72" y="62" width="28" height="34" fill="white"/>
        <path d="M74 75 Q86 65 98 75" fill="none" stroke="#E30613" stroke-width="4"/>
        <path d="M74 82 Q86 72 98 82" fill="none" stroke="#FFD100" stroke-width="4"/>
        <path d="M74 89 Q86 79 98 89" fill="none" stroke="#009639" stroke-width="4"/>

        <!-- Superior direito - balança -->
        <rect x="100" y="62" width="28" height="34" fill="#0057B8"/>
        <line x1="114" y1="70" x2="114" y2="88" stroke="white" stroke-width="2.5"/>
        <line x1="105" y1="74" x2="123" y2="74" stroke="white" stroke-width="2.5"/>
        <circle cx="107" cy="80" r="4" fill="white"/>
        <circle cx="121" cy="80" r="4" fill="white"/>

        <!-- Inferior esquerdo - planta -->
        <rect x="72" y="96" width="28" height="34" fill="#0057B8"/>
        <path d="M86 125 Q80 110 86 100 Q92 110 86 125" fill="white"/>
        <path d="M80 118 Q75 108 80 100" fill="none" stroke="white" stroke-width="2"/>
        <path d="M92 118 Q97 108 92 100" fill="none" stroke="white" stroke-width="2"/>

        <!-- Inferior direito - sol -->
        <rect x="100" y="96" width="28" height="34" fill="white"/>
        <circle cx="114" cy="113" r="10" fill="#FFD100"/>
        <g stroke="#FFD100" stroke-width="2.5" stroke-linecap="round">
          <line x1="114" y1="98" x2="114" y2="93"/>
          <line x1="114" y1="128" x2="114" y2="133"/>
          <line x1="99" y1="113" x2="94" y2="113"/>
          <line x1="129" y1="113" x2="134" y2="113"/>
          <line x1="103" y1="102" x2="99" y2="98"/>
          <line x1="125" y1="124" x2="129" y2="128"/>
          <line x1="125" y1="102" x2="129" y2="98"/>
          <line x1="103" y1="124" x2="99" y2="128"/>
        </g>
      </svg>
    </div>

    <h1 class="app-name">Área de Login</h1>
    <p class="app-subtitle">Acessar</p>

    /* Formulário de login */
    <section class="login-container" >
        <form class="login-form" action="/login" method="POST">
          
            <div class="input-group">
                <label for="identificacao">CPF ou Usuário:</label>
                <input type="text" id="identificacao" name="identificacao" required placeholder="Digite seu CPF ou usuário">
            </div>
            <div class="input-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="senha" required placeholder="Digite sua senha">
            </div>
           <input class = "btn btn-primary" type="submit" value="Entrar">
        </form>
    </section>

  


    <div class="footer">
      <p>Esqueceu a senha? <a href="#">Recuperar acesso</a></p>
    </div>
  </section>
</body>
</html>
