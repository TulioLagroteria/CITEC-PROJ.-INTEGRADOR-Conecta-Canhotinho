<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css" />
   <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  <title>Conecta Canhotinho</title>
</head>



<body>

  <!-- Botão no canto superior direito -->
  <button class="guest-btn">Entrar como convidado</button>

  <div class="container">
    <!-- Logo -->
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Ondas laterais -->
        <path d="M15 70 Q5 100 15 130" fill="none" stroke="#F4C300" stroke-width="10" stroke-linecap="round"/>
        <path d="M30 55 Q15 100 30 145" fill="none" stroke="#F4C300" stroke-width="10" stroke-linecap="round"/>
        <path d="M185 70 Q195 100 185 130" fill="none" stroke="#F4C300" stroke-width="10" stroke-linecap="round"/>
        <path d="M170 55 Q185 100 170 145" fill="none" stroke="#F4C300" stroke-width="10" stroke-linecap="round"/>

        <!-- Contorno do celular -->
        <rect x="50" y="30" width="100" height="140" rx="14" ry="14" fill="none" stroke="white" stroke-width="8"/>
        <rect x="80" y="38" width="40" height="8" rx="4" fill="white"/>

        <!-- Escudo -->
        <path d="M70 60 L130 60 L130 130 Q100 155 70 130 Z" fill="#FFD700" stroke="#FFD700"/>
        
        <!-- Superior esquerdo - arco-íris -->
        <rect x="72" y="62" width="28" height="34" fill="white"/>
        <path d="M74 75 Q86 65 98 75" fill="none" stroke="#E30613" stroke-width="4"/>
        <path d="M74 82 Q86 72 98 82" fill="none" stroke="#FFD100" stroke-width="4"/>
        <path d="M74 89 Q86 79 98 89" fill="none" stroke="#009639" stroke-width="4"/>

        <!-- Superior direito - balança -->
        <rect x="100" y="62" width="28" height="34" fill="#0057B8"/>
        <line x1="114" y1="70" x2="114" y2="88" stroke="white" stroke-width="2.5"/>
        <line x1="105" y1="74" x2="123" y2="74" stroke="white" stroke-width="2.5"/>
        <circle cx="107" cy="80" r="4" fill="white"/>
        <circle cx="121" cy="80" r="4" fill="white"/>

        <!-- Inferior esquerdo - planta -->
        <rect x="72" y="96" width="28" height="34" fill="#0057B8"/>
        <path d="M86 125 Q80 110 86 100 Q92 110 86 125" fill="white"/>
        <path d="M80 118 Q75 108 80 100" fill="none" stroke="white" stroke-width="2"/>
        <path d="M92 118 Q97 108 92 100" fill="none" stroke="white" stroke-width="2"/>

        <!-- Inferior direito - sol -->
        <rect x="100" y="96" width="28" height="34" fill="white"/>
        <circle cx="114" cy="113" r="10" fill="#FFD100"/>
        <g stroke="#FFD100" stroke-width="2.5" stroke-linecap="round">
          <line x1="114" y1="98" x2="114" y2="93"/>
          <line x1="114" y1="128" x2="114" y2="133"/>
          <line x1="99" y1="113" x2="94" y2="113"/>
          <line x1="129" y1="113" x2="134" y2="113"/>
          <line x1="103" y1="102" x2="99" y2="98"/>
          <line x1="125" y1="124" x2="129" y2="128"/>
          <line x1="125" y1="102" x2="129" y2="98"/>
          <line x1="103" y1="124" x2="99" y2="128"/>
        </g>
      </svg>
    </div>

    <h1 class="app-name">Conecta Canhotinho</h1>
    <p class="app-subtitle">Prefeitura Municipal de Canhotinho</p>

    <div class="buttons">
      <button class="btn btn-primary">Entrar</button>
      <button class="btn btn-secondary">Cadastrar-se</button>
    </div>

    <div class="footer">
      <p>Esqueceu a senha? <a href="#">Recuperar acesso</a></p>
    </div>
  </div>
</body>
</html>
