<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Conecta Canhotinho</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-login">

    <a href="index.html" class="login-voltar">
        Voltar ao início
    </a>

    <main class="login-principal">

        <section class="login-cartao">

            <a class="login-marca" aria-label="Página inicial">
                <img
                    src="imagens/logo1.png"
                    alt="Logo do Conecta Canhotinho">
            </a>

            <h1>Bem-vindo!</h1>

            <p class="login-descricao">
                Entre na sua conta para continuar.
            </p>

            <form id="form-login" method="post" action="/api/login">

                <div class="login-campo">
                    <label for="login-email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required>
                </div>

                <div class="login-campo">
                    <label for="login-senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="login-senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="login-opcoes">

                    <label class="login-lembrar">
                        <input
                            type="checkbox"
                            name="lembrar">

                        Lembrar-me
                    </label>

                    <a href="/recuperar-senha">
                        Esqueceu a senha?
                    </a>

                </div>

                <button type="submit" class="login-botao" id="btn-entrar">
                    Entrar
                </button>

            </form>

            <div class="login-separador">
                <span>ou</span>
            </div>

            <a href="/cadastro" class="login-botao-cadastro">
                Criar uma conta
            </a>

            <footer class="login-rodape">
                © 2026 Conecta Canhotinho
            </footer>

        </section>

    </main>

    <!-- Vinculação do arquivo JS separado -->
    <script src="js/areadelogin.js"></script>

</body>

</html>
