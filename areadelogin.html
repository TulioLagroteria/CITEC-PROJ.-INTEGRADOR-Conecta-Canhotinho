<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Canhotinho Conectado</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


    <main class="login-container">


        <div class="login-box">


            <!-- LOGO -->

            <div class="login-logo">

                <span>CANHOTINHO</span>

                <strong>CONECTADO</strong>

            </div>


            <!-- TÍTULO -->

            <h1>
                Entrar
            </h1>


            <p class="login-description">

                Acesse sua conta para continuar.

            </p>


            <!-- FORMULÁRIO -->

            <form id="loginForm">


                <!-- USUÁRIO -->

                <div class="form-group">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <!-- OPÇÕES -->

                <div class="login-options">

                    <label>

                        <input
                            type="checkbox"
                            id="lembrar"
                        >

                        Lembrar de mim

                    </label>


                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn-entrar"
                >

                    Entrar

                </button>


                <!-- MENSAGEM -->

                <p
                    id="loginMensagem"
                    class="login-mensagem"
                ></p>


            </form>


            <!-- CADASTRO -->

            <div class="cadastro">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href="#">
                    Criar uma conta
                </a>

            </div>


            <!-- VOLTAR -->

            <a
                href="index.html"
                class="voltar"
            >

                ← Voltar para a página inicial

            </a>


        </div>


    </main>


    <script src="script.js"></script>

</body>

</html>
