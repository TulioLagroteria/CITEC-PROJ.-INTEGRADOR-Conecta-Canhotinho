<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css" />
  <title>Conecta Canhotinho</title>
</head>
<body>

       <!-- Botão no canto superior direito -->
    <button
        class="guest-btn"
        onclick="window.location.href='fila.html'">

        Entrar como convidado

    </button>


    <!-- Conteúdo principal -->
    <main class="home-container">

        <!-- Nova logo -->
        <div class="logo-container">

            <img
                src="imagens/logo1.png"
                alt="Logo Conecta Canhotinho"
                class="logo">

        </div>


        <!-- Nome do aplicativo -->
        <h1 class="app-name">
            Conecta Canhotinho
        </h1>


        <!-- Subtítulo -->
        <p class="app-subtitle">
            Prefeitura Municipal de Canhotinho
        </p>


        <!-- Botões -->
        <div class="buttons">

            <button
                class="btn btn-primary"
                onclick="window.location.href='fila.html'">

                Entrar

            </button>


            <button
                class="btn btn-secondary"
                onclick="alert('Cadastro disponível em breve!')">

                Cadastrar-se

            </button>

        </div>


        <!-- Rodapé -->
        <div class="footer">

            <p>
                Esqueceu a senha?
                <a href="#">
                    Recuperar acesso
                </a>
            </p>

        </div>

    </main>


</body>
</html>
